name: Feature 15 A1 quality regression
on:
  pull_request:
    paths:
      - 'custom_components/casa_premium/quality.py'
      - 'custom_components/casa_premium/__init__.py'
      - 'tests/test_feature15_quality_a1.py'
      - '.github/workflows/feature15-a1.yml'
  push:
    branches:
      - feature/15-a1-quality-calibration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed modules
        run: python -m py_compile custom_components/casa_premium/quality.py custom_components/casa_premium/__init__.py tests/test_feature15_quality_a1.py
      - name: Run isolated quality regression tests
        run: python -m unittest discover -s tests -p 'test_feature15_quality_a1.py' -v
