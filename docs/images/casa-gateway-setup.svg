<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
<rect width="1120" height="660" rx="24" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#202124">
<text x="48" y="66" font-size="31" font-weight="bold">CASA Premium TCP gateway</text>
<text x="48" y="115" font-size="20">Read-only: no control or clock commands are sent to the ventilation unit.</text>
<rect x="48" y="157" width="1024" height="137" rx="12" fill="#f3f3f3"/>
<text x="72" y="194" font-size="18" fill="#606368">Gateway IP address or hostname*</text>
<text x="72" y="247" font-size="32">casa-gateway.example</text>
<path d="M48 293H1072" stroke="#666" stroke-width="2"/>
<rect x="48" y="330" width="1024" height="137" rx="12" fill="#f3f3f3"/>
<text x="72" y="368" font-size="18" fill="#008fb4">TCP port*</text>
<text x="72" y="421" font-size="32">8899</text>
<path d="M48 466H1072" stroke="#009ec6" stroke-width="4"/>
<rect x="899" y="502" width="173" height="62" rx="31" fill="#009ec6"/>
<text x="985" y="541" text-anchor="middle" font-size="23" fill="#fff">Submit</text>
<text x="48" y="598" font-size="18" fill="#606368">Illustrative installation form. Replace the example hostname with your converter's address.</text>
<text x="48" y="630" font-size="17" fill="#606368">Configure serial settings on the converter; this form sets only the Home Assistant TCP endpoint.</text>
</g></svg>
