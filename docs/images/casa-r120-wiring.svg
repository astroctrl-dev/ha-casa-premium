<text x="480" y="747" font-size="20" font-weight="bold">CASA pin 2 · Black · +5 V: LEAVE UNCONNECTED</text>
<text x="40" y="835" font-size="25" font-weight="bold">Yellow → signal GND. Supply negative → V−. Keep these external connections distinct.</text>
<text x="40" y="882" font-size="22">Do not power the converter from CASA. Retain the original CASA control panel.</text>
<text x="40" y="926" font-size="20">Terminal labels define the connections; this drawing is schematic, not a physical terminal-position drawing.</text>
<text x="40" y="965" font-size="20">No claim of internal isolation between V− and GND. Disconnect power and verify polarity before connecting.</text>
<text x="40" y="1004" font-size="20">Use at your own risk. Verify electrical specifications and use qualified help where required.</text>
